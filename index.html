<style>
/* ============================================================
   FLOW CONTENT — Link in Bio  |  Design Minimalista Premium
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --c-brand:     #0A222B;   /* cor da marca (ícone) */
  --c-brand-h:   #163B4A;   /* variação para hover */
  --c-bg:        #FFFFFF;
  --c-surface:   #F4F6F7;
  --c-ice:       #F7F7F7;   /* texto sobre fundo escuro (botões) */
  --c-ink:       #0A222B;   /* texto principal sobre branco */
  --c-muted:     #5C6B72;
  --c-border:    rgba(10,34,43,0.10);
  --c-border-h:  rgba(10,34,43,0.22);
  --font: 'Inter', system-ui, sans-serif;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
}

html { font-size: 16px; }

body {
  font-family: var(--font);
  background-color: var(--c-bg);
  color: var(--c-ink);
  min-height: 100vh;
  min-height: 100dvh;
  /* Sticky footer: empurra o rodapé para o fim da tela quando o conteúdo é curto */
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }

/* ---- AMBIENT GLOW (tom da marca, bem sutil sobre o branco) ---- */
.glow {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
  filter: blur(100px);
}
.glow-1 {
  width: 500px; height: 500px;
  top: -240px; left: 50%;
  transform: translateX(-50%);
  background: radial-gradient(circle, rgba(10,34,43,0.05) 0%, transparent 70%);
}
.glow-2 {
  width: 340px; height: 300px;
  bottom: 0; right: -100px;
  background: radial-gradient(circle, rgba(10,34,43,0.035) 0%, transparent 70%);
}

/* ---- LAYOUT ---- */
.wrap {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 440px;
  margin: 0 auto;
  padding: 24px 20px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
}

/* ====================================================
   HERO
   ==================================================== */
.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 0;
  width: 100%;
}

/* --- LOGO / AVATAR REDONDO (estilo foto de perfil) --- */
.logo {
  margin-bottom: 18px;
}

.logo--img {
  display: flex;
  justify-content: center;
  align-items: center;
}

.logo__img {
  width: 132px;
  height: 132px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  box-shadow: 0 6px 22px rgba(10,34,43,0.12);
}

/* Badge */
.hero__badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 13px;
  border: 1px solid var(--c-border-h);
  border-radius: 100px;
  font-size: 0.62rem;
  font-weight: 600;
  letter-spacing: 0.2em;
  color: var(--c-muted);
  text-transform: uppercase;
  margin-bottom: 20px;
}

.hero__badge-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--c-muted);
  opacity: 0.6;
}

.hero__headline {
  font-size: clamp(1.3rem, 5vw, 1.55rem);
  font-weight: 700;
  line-height: 1.35;
  letter-spacing: -0.025em;
  color: var(--c-ink);
  margin-bottom: 20px;
  margin-top: 0px;
  max-width: 340px;
}

.hero__desc {
  font-size: 0.88rem;
  font-weight: 300;
  line-height: 1.7;
  color: var(--c-muted);
  max-width: 320px;
}

/* ====================================================
   DIVIDER
   ==================================================== */
.divider {
  width: 100%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(10,34,43,0.16) 30%, rgba(10,34,43,0.16) 70%, transparent);
}

/* ====================================================
   BOTÕES PRINCIPAIS
   ==================================================== */
.cta-block {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  min-height: 54px;
  padding: 14px 22px;
  border-radius: 14px;
  font-family: var(--font);
  font-size: 0.9rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  cursor: pointer;
  border: none;
  transition: transform 0.22s var(--ease), box-shadow 0.22s var(--ease), background 0.22s var(--ease);
  position: relative;
  overflow: hidden;
}

/* Shimmer on hover */
.btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.08) 50%, transparent 60%);
  transform: translateX(-100%);
  transition: transform 0.5s var(--ease);
}
.btn:hover::after { transform: translateX(100%); }

.btn--primary {
  background: var(--c-brand);
  color: var(--c-ice);
}
.btn--primary:hover {
  transform: translateY(-2px);
  background: var(--c-brand-h);
  box-shadow: 0 10px 30px rgba(10,34,43,0.22);
}
.btn--primary:active { transform: translateY(0); }

.btn--outline {
  background: transparent;
  color: var(--c-ink);
  border: 1px solid var(--c-border-h);
}
.btn--outline:hover {
  transform: translateY(-2px);
  border-color: var(--c-brand);
  background: rgba(10,34,43,0.04);
}

.btn svg {
  width: 17px; height: 17px;
  flex-shrink: 0;
}

/* ====================================================
   LINK CARDS
   ==================================================== */
.links {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
}

.link-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  background: var(--c-brand);
  border: 1px solid var(--c-brand);
  border-radius: 14px;
  min-height: 54px;
  box-shadow: 0 2px 10px rgba(10,34,43,0.10);
  transition: transform 0.22s var(--ease), background 0.22s var(--ease), box-shadow 0.22s var(--ease);
  cursor: pointer;
}

.link-card:hover {
  transform: translateX(4px);
  background: var(--c-brand-h);
  border-color: var(--c-brand-h);
  box-shadow: 0 8px 22px rgba(10,34,43,0.22);
}

.link-card__icon {
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(247,247,247,0.10);
  border-radius: 8px;
  flex-shrink: 0;
}
.link-card__icon svg { width: 15px; height: 15px; color: rgba(247,247,247,0.85); }

.link-card__label {
  flex: 1;
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--c-ice);
}

.link-card__arrow {
  color: var(--c-ice);
  font-size: 0.85rem;
  opacity: 0.6;
  transition: transform 0.2s var(--ease), opacity 0.2s var(--ease);
}
.link-card:hover .link-card__arrow {
  transform: translateX(3px);
  opacity: 1;
}

/* ====================================================
   SERVIÇOS
   ==================================================== */
.services {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.section-label {
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.22em;
  color: var(--c-muted);
  text-transform: uppercase;
  text-align: center;
  opacity: 0.6;
}

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  justify-content: center;
}

.tag {
  padding: 6px 13px;
  border: 1px solid var(--c-border);
  border-radius: 100px;
  font-size: 0.76rem;
  font-weight: 400;
  color: var(--c-muted);
  transition: border-color 0.2s, color 0.2s, background 0.2s;
  cursor: default;
}
.tag:hover {
  border-color: var(--c-border-h);
  color: var(--c-ink);
  background: rgba(10,34,43,0.04);
}

/* ====================================================
   CTA FINAL
   ==================================================== */
.final-cta {
  width: 100%;
  background: linear-gradient(140deg, #FFFFFF, var(--c-surface));
  border: 1px solid var(--c-border);
  border-radius: 20px;
  padding: 36px 28px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  position: relative;
  overflow: hidden;
}

.final-cta::before {
  content: '';
  position: absolute;
  top: -80px; right: -80px;
  width: 220px; height: 220px;
  background: radial-gradient(circle, rgba(10,34,43,0.05) 0%, transparent 65%);
  pointer-events: none;
}

.final-cta__eyebrow {
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.22em;
  color: var(--c-muted);
  text-transform: uppercase;
  opacity: 0.6;
}

.final-cta__title {
  font-size: clamp(1.45rem, 5vw, 1.75rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--c-ink);
  line-height: 1.2;
}

.final-cta__sub {
  font-size: 0.85rem;
  font-weight: 300;
  color: var(--c-muted);
  margin-bottom: 6px;
}

.final-cta .btn {
  width: auto;
  min-width: 220px;
  padding: 14px 28px;
}

/* ====================================================
   FOOTER
   ==================================================== */
footer {
  position: relative;
  z-index: 1;
  border-top: 1px solid var(--c-border);
  width: 100%;
  /* Absorve o espaço sobrando e cola o rodapé na base da tela */
  margin-top: auto;
}

.footer-inner {
  max-width: 440px;
  margin: 0 auto;
  padding: 28px 20px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  text-align: center;
}

.footer__brand {
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--c-muted);
  opacity: 0.7;
}

.footer__tagline {
  font-size: 0.72rem;
  font-weight: 300;
  color: var(--c-muted);
  opacity: 0.5;
  letter-spacing: 0.05em;
}

.footer__icons {
  display: flex;
  gap: 10px;
}

.footer__icon {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--c-border);
  border-radius: 9px;
  color: var(--c-muted);
  transition: border-color 0.2s, color 0.2s, transform 0.2s;
}
.footer__icon svg { width: 14px; height: 14px; }
.footer__icon:hover {
  border-color: var(--c-brand);
  color: var(--c-brand);
  transform: translateY(-2px);
}

.footer__copy {
  font-size: 0.68rem;
  color: var(--c-muted);
  opacity: 0.35;
  letter-spacing: 0.04em;
  text-decoration: none;
}

.footer__copy > a:hover {
  text-decoration: underline;
  color: var(--c-brand);
}
/* ====================================================
   ENTRANCE ANIMATIONS
   ==================================================== */
[data-reveal] {
  opacity: 0;
  transform: translateY(18px);
  transition: opacity 0.6s var(--ease), transform 0.6s var(--ease);
}
[data-reveal].visible {
  opacity: 1;
  transform: translateY(0);
}

/* ====================================================
   REDUCED MOTION
   ==================================================== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* ====================================================
   RESPONSIVE
   ==================================================== */
@media (min-width: 440px) {
  .cta-block { flex-direction: row; }
  .btn { flex: 1; }
}
@media (max-width: 360px) {
  .wrap { padding: 40px 16px 32px; }
  .logo__flow { font-size: 1.6rem; }
}
</style>
</head>

<script>
// ---- REVEAL ON SCROLL ----
const observer = new IntersectionObserver((entries) => {
  entries.forEach((entry, i) => {
    if (entry.isIntersecting) {
      // Stagger siblings
      const siblings = [...entry.target.parentElement.querySelectorAll('[data-reveal]')];
      const idx = siblings.indexOf(entry.target);
      setTimeout(() => entry.target.classList.add('visible'), idx * 80);
      observer.unobserve(entry.target);
    }
  });
}, { threshold: 0.1 });

document.querySelectorAll('[data-reveal]').forEach(el => observer.observe(el));

// ---- RIPPLE on primary buttons ----
document.querySelectorAll('.btn--primary').forEach(btn => {
  btn.addEventListener('pointerdown', function(e) {
    const r = btn.getBoundingClientRect();
    const d = Math.max(btn.clientWidth, btn.clientHeight) * 2;
    const s = document.createElement('span');
    s.style.cssText = `
      position:absolute; width:${d}px; height:${d}px; border-radius:50%;
      background:rgba(10,34,43,0.15); pointer-events:none;
      left:${e.clientX - r.left - d/2}px; top:${e.clientY - r.top - d/2}px;
      transform:scale(0); animation:rpl 0.5s ease-out forwards;
    `;
    if (!document.getElementById('rpl-css')) {
      const st = document.createElement('style');
      st.id = 'rpl-css';
      st.textContent = '@keyframes rpl{to{transform:scale(1);opacity:0}}';
      document.head.appendChild(st);
    }
    btn.appendChild(s);
    setTimeout(() => s.remove(), 520);
  });
});

// ---- MAGNETIC hover on link cards ----
document.querySelectorAll('.link-card').forEach(card => {
  card.addEventListener('mousemove', e => {
    const r = card.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width - 0.5) * 6;
    const y = ((e.clientY - r.top) / r.height - 0.5) * 3;
    card.style.transform = `translateX(${4 + x}px) translateY(${y}px)`;
  });
  card.addEventListener('mouseleave', () => {
    card.style.transform = '';
  });
});
</script>
