<style>
/* ============================================================
   FLOW CONTENT PROMOS — Landing FLOW FIT
   Layout inspirado no modelo de referência (7651435.jpg).
   Onde o modelo usa amarelo, aqui entra a cor da marca.
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --c-brand:    #0A222B;   /* cor da marca (substitui o amarelo do modelo) */
  --c-brand-h:  #163B4A;   /* hover */
  --c-bg:       #FFFFFF;
  --c-ice:      #F7F7F7;
  --c-ink:      #0A222B;
  --c-muted:    #3E4E55;
  --c-line:     rgba(10,34,43,0.85);
  --font: 'Nunito', system-ui, sans-serif;
  --font-classic: 'Playfair Display', Georgia, 'Times New Roman', serif;  /* fonte clássica do título FLOW FIT */
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  /* respiro lateral: cresce com a tela, sem deixar "bordas" vazias */
  --gutter: clamp(16px, 6vw, 140px);
}

html { font-size: 16px; }

body {
  font-family: var(--font);
  background: var(--c-bg);
  color: var(--c-ink);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }

.page {
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
  width: 100%;
  overflow: hidden;
}

/* ====================================================
   TOPO (nav do modelo)
   ==================================================== */
.top {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  padding: clamp(20px, 4vw, 40px) var(--gutter) 0;
  border-bottom: 2px solid var(--c-brand);
  position: relative;
  z-index: 2;
}

.top__home {
  font-weight: 900;
  font-size: 0.95rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  padding: 0 14px 12px;
  position: relative;
}
.top__home::after {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: -5px;
  height: 6px;
  background: var(--c-brand);
}

.top__nav {
  display: flex;
  gap: clamp(16px, 4vw, 56px);
  padding-bottom: 12px;
}
.top__nav a {
  font-size: 0.95rem;
  font-weight: 400;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--c-ink);
  transition: opacity 0.2s var(--ease);
}
.top__nav a:hover { opacity: 0.6; }

/* ====================================================
   HERO
   ==================================================== */
.hero {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0,1fr) minmax(0,1fr);
  align-items: center;
  align-content: center;
  gap: clamp(24px, 5vw, 72px);
  padding: clamp(40px, 6vw, 80px) var(--gutter) clamp(90px, 9vw, 130px);
  position: relative;
  z-index: 1;
}

.hero__text {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

/* Ícones em quadradinhos (amarelo -> marca) */
.icons {
  display: flex;
  gap: 10px;
  margin-bottom: 22px;
}
.icons span {
  width: 52px; height: 52px;
  border-radius: 16px;
  background: var(--c-brand);
  color: var(--c-ice);
  display: flex; align-items: center; justify-content: center;
}
.icons svg { width: 28px; height: 28px; }

.title {
  font-family: var(--font-classic);
  font-weight: 400;
  font-size: clamp(3.4rem, 9vw, 6.6rem);
  line-height: 0.95;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.title-fit {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: 6px;
  font-family: var(--font-classic);
  font-weight: 900;
  font-size: clamp(2.6rem, 6.5vw, 4.8rem);
  line-height: 1;
  letter-spacing: 0.06em;
}
.title-fit svg {
  height: 0.9em;
  width: auto;
  flex-shrink: 0;
}

.desc {
  max-width: 400px;
  margin: 26px 0 30px;
  font-size: clamp(1rem, 1.6vw, 1.15rem);
  line-height: 1.5;
  color: var(--c-muted);
}
.desc strong { color: var(--c-ink); font-weight: 800; }

/* ---- BOTÃO ÚNICO ---- */
.cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  min-height: 72px;
  min-width: min(100%, 380px);
  padding: 20px 52px;
  border-radius: 14px;
  background: var(--c-brand);
  color: var(--c-ice);
  font-family: var(--font);
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  box-shadow: 0 8px 24px rgba(10,34,43,0.22);
  transition: transform 0.22s var(--ease), background 0.22s var(--ease), box-shadow 0.22s var(--ease);
}
.cta svg { width: 26px; height: 26px; flex-shrink: 0; }
.cta:hover {

  background: var(--c-brand-h);

.cta:active { transform: translateY(0); }
.cta:focus-visible { outline: 3px solid var(--c-brand); outline-offset: 4px; }

/* ====================================================
   FOTO EM TELA CHEIA À DIREITA, com degradê vindo da esquerda
   ==================================================== */
.visual {
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: 58%;
  z-index: 0;
}

.visual__photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 75% 30%;
  display: block;
}

/* Degradê: branco na esquerda que vai sumindo até mostrar a foto */
.visual::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg,
    #FFFFFF 0%,
    rgba(255,255,255,0.92) 8%,
    rgba(255,255,255,0.6) 18%,
    rgba(255,255,255,0.2) 30%,
    rgba(255,255,255,0) 42%);
  pointer-events: none;
}

/* Selo (o "20% OFF" amarelo do modelo) */
.badge {
  position: absolute;
  z-index: 1;
  left: 20%;
  bottom: 9%;
  width: clamp(130px, 11vw, 190px);
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--c-brand);
  color: var(--c-ice);
  border: 6px solid var(--c-bg);
  box-shadow: 0 10px 28px rgba(10,34,43,0.28);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-weight: 900;
  line-height: 1;
  text-transform: uppercase;
}
.badge b { font-size: clamp(1.7rem, 2.9vw, 2.7rem); line-height: 0.95; letter-spacing: -0.01em; }
.badge small {
  font-size: clamp(0.62rem, 1.3vw, 0.85rem);
  font-weight: 700;
  letter-spacing: 0.12em;
  margin-top: 4px;
}

/* ====================================================
   DECORAÇÕES DO MODELO
   ==================================================== */
.deco { position: absolute; pointer-events: none; z-index: 0; }

/* Círculo pontilhado no canto inferior esquerdo */
.deco--halftone {
  left: -50px; bottom: -50px;
  width: 240px; height: 240px;
  border-radius: 50%;
  background-image: radial-gradient(circle, var(--c-brand) 30%, transparent 34%);
  background-size: 11px 11px;
}

/* Listras diagonais embaixo, no centro */
.deco--stripes {
  left: 32%; bottom: 0;
  width: 260px; height: 64px;
  transform: translateX(-50%);
  background: repeating-linear-gradient(-62deg, var(--c-brand) 0 5px, transparent 5px 20px);
}

/* Anel vazado no canto superior esquerdo */
.deco--ring {
  left: -90px; top: 14%;
  width: 240px; height: 240px;
  border-radius: 50%;
  border: 22px solid rgba(10,34,43,0.08);
}

/* Pontinhos à esquerda, perto do título */
.deco--grid-left {
  left: calc(var(--gutter) * 0.75); top: 44%;
  width: 64px; height: 130px;
  background-image: radial-gradient(circle, rgba(10,34,43,0.3) 28%, transparent 32%);
  background-size: 16px 16px;
}

/* Sinais de "+" espalhados */
.deco--plus {
  width: 22px; height: 22px;
  background:
    linear-gradient(var(--c-brand), var(--c-brand)) center / 100% 4px no-repeat,
    linear-gradient(var(--c-brand), var(--c-brand)) center / 4px 100% no-repeat;
}
.deco--plus.p1 { left: 44%; top: 17%; opacity: 0.85; }
.deco--plus.p2 { left: 6%;  top: 66%; opacity: 0.5; transform: scale(0.8); }
.deco--plus.p4 { left: 50%; top: 66%; opacity: 0.4; transform: scale(0.7); }

/* Linha em zigue-zague */
.deco--zigzag {
  left: 38%; top: 30%;
  width: 90px; height: 18px;
  color: var(--c-brand);
  opacity: 0.55;
}

/* Texto vertical na lateral esquerda */
.deco--vtext {
  left: calc(var(--gutter) * 0.32);
  top: 55%;
  transform: translate(-50%, -50%) rotate(-90deg);
  white-space: nowrap;
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.5em;
  text-transform: uppercase;
  color: rgba(10,34,43,0.28);
}

/* Triângulos empilhados à direita, em branco sobre a foto */
.deco--tris {
  right: calc(var(--gutter) * 0.4);
  bottom: 50px;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.deco--tris i {
  width: 0; height: 0;
  border-left: 12px solid transparent;
  border-right: 12px solid transparent;
  border-bottom: 20px solid #FFFFFF;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
}

/* ====================================================
   RODAPÉ
   ==================================================== */
footer {
  width: 100%;
  border-top: 1px solid rgba(10,34,43,0.10);
  padding: 20px 16px 28px;
  text-align: center;
  font-size: 0.75rem;

footer a:hover { text-decoration: underline; }

/* ====================================================
   ANIMAÇÃO DE ENTRADA
   ==================================================== */
[data-reveal] {
  opacity: 0;
  transform: translateY(18px);
  transition: opacity 0.6s var(--ease), transform 0.6s var(--ease);
}
[data-reveal].visible { opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* ====================================================
   RESPONSIVO

@media (max-width: 860px) {

  .deco--vtext, .deco--grid-left, .deco--zigzag, .deco--plus.p1, .deco--plus.p2, .deco--plus.p4 { display: none; }
  .deco--ring { width: 160px; height: 160px; border-width: 16px; left: -80px; top: 52%; }

@media (max-width: 520px) {

}

<script>
// ---- REVEAL ----
// Rede de segurança: [data-reveal] nasce invisível. Se o IntersectionObserver
// faltar ou falhar, o temporizador revela tudo — o botão nunca pode sumir.
function revelarTudo() {
  document.querySelectorAll('[data-reveal]').forEach(el => el.classList.add('visible'));
}
try {
  if (typeof IntersectionObserver !== 'function') throw new Error('sem IntersectionObserver');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry, i) => {
      if (entry.isIntersecting) {
        setTimeout(() => entry.target.classList.add('visible'), i * 120);
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('[data-reveal]').forEach(el => observer.observe(el));
  setTimeout(revelarTudo, 3000);
} catch (e) {
  revelarTudo();
}
</script>

<!-- ===== Meta Pixel + API de Conversões: evento Lead no botão do grupo ===== -->
<script>
(function () {
  var cards = document.querySelectorAll('[data-grupo]');
  if (!cards.length) return;

  // O pixel é OPCIONAL aqui. Se ele estiver bloqueado, a API de Conversões
  // continua sendo enviada — é justamente o caminho que precisa sobreviver.
  var temPixel = (typeof fbq === 'function');

  // Congelado no carregamento: o _fbc reconstruído tem que ser estável.
  var TS_ENTRADA = Date.now();
  var PARAMS = (function () {
    try { return new URLSearchParams(location.search); } catch (e) { return null; }
  })();

  // decodeURIComponent lança em qualquer cookie com "%" solto.
  function lerCookie(nome) {
    var m = document.cookie.match('(^|;)\\s*' + nome + '\\s*=\\s*([^;]+)');
    if (!m) return undefined;
    try { return decodeURIComponent(m[2]); } catch (e) { return m[2]; }
  }

  function obterFbclid() {
    return (PARAMS && PARAMS.get('fbclid')) || undefined;
  }

  // Se o pixel ainda não gravou o _fbc, reconstrói a partir do fbclid da URL.
  function obterFbc() {
    var cookie = lerCookie('_fbc');
    if (cookie) return cookie;
    var fbclid = obterFbclid();
    return fbclid ? 'fb.1.' + TS_ENTRADA + '.' + fbclid : undefined;
  }

  // Trava por grupo, na sessão: quem volta do WhatsApp e toca de novo
  // no botão não conta como lead novo.
  function jaContou(grupo) {
    try { return sessionStorage.getItem('flow_lead_' + grupo) === '1'; }
    catch (e) { return false; }
  }
  function marcarContado(grupo) {
    try { sessionStorage.setItem('flow_lead_' + grupo, '1'); } catch (e) {}
  }

  function dispararLead(el) {
    var grupo = el.dataset.grupo;
    var nicho = el.dataset.nicho;
    if (!grupo) return;

    var agora = Date.now();
    if (el.__leadTs && agora - el.__leadTs < 2000) return;
    el.__leadTs = agora;

    if (jaContou(grupo)) return;
    marcarContado(grupo);

    // Um único event_id para os dois caminhos: a Meta deduplica e conta uma vez.
    var sufixo = (Math.random().toString(36) + '00000000').slice(2, 10);
    var eventId = 'lead-' + agora + '-' + sufixo;

    var corpo = JSON.stringify({
      event_id: eventId,
      event_time: Math.floor(agora / 1000),
      content_name: grupo,
      content_category: nicho,
      event_source_url: location.href,
      fbp: lerCookie('_fbp'),
      fbc: obterFbc(),
      fbclid: obterFbclid()
    });

    // Caminho 1 — API de Conversões, PRIMEIRO. Quando o sendBeacon existe,
    // ele é o único caminho (pode devolver false e mesmo assim entregar).
    try {
      if (navigator.sendBeacon) {
        try {
          navigator.sendBeacon('/api/lead', new Blob([corpo], { type: 'application/json' }));
        } catch (e) {
          if (window.fetch) {
            fetch('/api/lead', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: corpo,
              keepalive: true
            }).catch(function () {});
          }
        }
      } else if (window.fetch) {
        fetch('/api/lead', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: corpo,
          keepalive: true
        }).catch(function () {});
      }
    } catch (e) {}

    // Caminho 2 — pixel do navegador, isolado para não derrubar o de cima.
    if (temPixel) {
      try {
        fbq('track', 'Lead',
          { content_name: grupo, content_category: nicho },
          { eventID: eventId });
      } catch (e) {}
    }
  }

  cards.forEach(function (el) {
    el.addEventListener('click', function (e) {
      if (e.isTrusted === false) return;
      dispararLead(el);
    });
    el.addEventListener('auxclick', function (e) {
      if (e.isTrusted === false || e.button !== 1) return;
      dispararLead(el);
    });
  });
})();
</script>

</html>
