<style>
/* ============================================================
   FLOW CONTENT PROMOS — Landing FLOW FIT
   Painel escuro à esquerda (borda ondulada) e
   foto recortada com contorno amarelo à direita.
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --c-brand:  #0A222B;   /* painel, textos escuros */
  --c-yellow: #FFD62E;   /* destaques, contorno da foto, halteres */
  --c-paper:  #EDEDEF;   /* fundo do lado direito */
  --c-white:  #FFFFFF;

  --f-display: 'Archivo Black', 'Arial Black', system-ui, sans-serif;
  --f-label:   'Unbounded', 'Arial Black', system-ui, sans-serif;
  --f-body:    'DM Sans', system-ui, sans-serif;

  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --pad: clamp(16px, 5vw, 80px);
  --wave: 14px;          /* raio das "bolinhas" da borda ondulada */
}

body {
  font-family: var(--f-body);
  background: var(--c-paper);
  color: var(--c-brand);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

a { color: inherit; text-decoration: none; }

/* ====================================================
   LAYOUT: dois painéis lado a lado
   ==================================================== */
.page {
  flex: 1;
  display: grid;
  grid-template-columns: 56fr 44fr;
  position: relative;
  overflow: hidden;
}

/* ---------- PAINEL ESQUERDO ---------- */
.panel {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  padding: clamp(20px, 3vw, 36px) var(--pad) clamp(40px, 5vw, 64px);
  background: var(--c-brand);
  color: var(--c-white);
}

/* borda ondulada (bolinhas da cor do painel invadindo o lado claro) */
.panel::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  right: calc(var(--wave) * -1);
  width: var(--wave);
  background: radial-gradient(circle at 0 50%, var(--c-brand) calc(var(--wave) - 0.5px), transparent var(--wave));
  background-size: var(--wave) calc(var(--wave) * 2);
}

/* ---------- MENU ---------- */
.nav {
  display: flex;
  flex-wrap: wrap;
  gap: 6px clamp(16px, 2.4vw, 32px);
  font-weight: 500;
}
.nav a { transition: color 0.2s var(--ease); }
.nav a:hover, .nav a[aria-current] { color: var(--c-yellow); }

/* ---------- CONTEÚDO (centralizado) ---------- */
.content {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: clamp(40px, 6vw, 80px) 0 clamp(24px, 3vw, 40px);
}

.title {
  font-family: var(--f-display);
  font-weight: 400;
  font-size: clamp(2.5rem, 6.4vw, 5.6rem);
  line-height: 1.02;
  letter-spacing: -0.02em;
}
.title em { font-style: normal; color: var(--c-yellow); }

.subtitle {
  margin-top: clamp(32px, 4vw, 52px);
  font-family: var(--f-label);
  font-weight: 900;
  font-size: clamp(0.82rem, 1.1vw, 1rem);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--c-yellow);
}

.desc {
  max-width: 40ch;
  margin: 10px 0 22px;
  font-size: 0.95rem;
  line-height: 1.55;
  color: rgba(255,255,255,0.86);
}

/* ---------- BOTÃO DO GRUPO ---------- */
.cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-width: 360px;
  min-height: 58px;
  padding: 16px 48px;
  border-radius: 999px;
  background: var(--c-white);
  color: var(--c-brand);
  font-family: var(--f-label);
  font-weight: 700;
  font-size: 0.95rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  white-space: nowrap;
  box-shadow: 0 8px 22px rgba(0,0,0,0.25);
  touch-action: manipulation;
  transition: transform 0.2s var(--ease), background-color 0.2s var(--ease);
}
.cta svg { width: 20px; height: 20px; flex-shrink: 0; }
.cta:hover { transform: translateY(-2px); background: var(--c-yellow); }
.cta:active { transform: none; }
.cta:focus-visible { outline: 3px solid var(--c-yellow); outline-offset: 3px; }

/* ---------- PAINEL DIREITO ---------- */
.side {
  position: relative;
  display: flex;
  min-width: 0;
  padding: clamp(20px, 3vw, 36px) var(--pad) 0 calc(var(--pad) * 0.6 + var(--wave));
}

.photo {
  flex: 1;
  position: relative;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-top: clamp(90px, 10vw, 140px);
}

/* contorno amarelo recortado (fica atrás da foto) */
.photo__frame {
  position: relative;
  width: min(100%, 520px);
  aspect-ratio: 5 / 6;
}
.photo__frame::before {
  content: '';
  position: absolute;
  inset: -16px;
  background: var(--c-yellow);
  clip-path: polygon(14% 4%, 34% 0%, 58% 6%, 82% 1%, 100% 18%, 95% 40%, 100% 62%, 94% 84%, 100% 100%, 0% 100%, 5% 78%, 0% 56%, 7% 34%, 1% 16%);
}
.photo__frame img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 35%;
  filter: grayscale(1) contrast(1.08);
  clip-path: polygon(16% 7%, 35% 3%, 57% 9%, 80% 4%, 96% 20%, 92% 41%, 97% 62%, 91% 84%, 96% 100%, 4% 100%, 8% 78%, 3% 56%, 10% 34%, 4% 18%);
  transition: filter 0.5s var(--ease);
}
@media (hover: hover) {
  .photo__frame:hover img { filter: none; }
}

/* etiqueta amarela inclinada */
.tag {
  position: absolute;
  left: calc(var(--wave) * -1 - 70px);
  bottom: 12%;
  z-index: 3;
  padding: 12px 28px;
  border-radius: 50%;
  background: var(--c-yellow);
  color: #000;
  font-family: var(--f-label);
  font-weight: 900;
  font-size: clamp(0.9rem, 1.3vw, 1.15rem);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  white-space: nowrap;
  transform: rotate(-10deg);
  box-shadow: 0 6px 18px rgba(0,0,0,0.18);
}

/* ---------- HALTERES (desenho vazado amarelo) ---------- */
.halter {
  position: absolute;
  pointer-events: none;
  color: var(--c-yellow);
  fill: none;
  stroke: currentColor;
  stroke-width: 2.2;
  stroke-linejoin: round;
}
.halter--topo   { left: 3%;  top: 4%;    width: clamp(90px, 10vw, 150px); transform: rotate(-12deg); }
.halter--foto   { right: 2%; bottom: 3%; width: clamp(70px, 7vw, 110px);  transform: rotate(14deg); }
.halter--painel { left: 1%;  bottom: 3%; width: clamp(80px, 8vw, 120px);  transform: rotate(18deg); }

/* ====================================================
   RODAPÉ
   ==================================================== */
footer {
  background: var(--c-brand);
  color: rgba(255,255,255,0.7);
  padding: 18px 16px 22px;
  text-align: center;
  font-size: 0.75rem;
}
footer a:hover { color: var(--c-yellow); }

/* ====================================================
   ANIMAÇÃO DE ENTRADA (só CSS: não espera JavaScript)
   ==================================================== */
.reveal { animation: entrar 0.6s var(--ease) backwards; }   /* "backwards": some ao terminar, sem mudar camadas */
.reveal--2 { animation-delay: 0.12s; }
@keyframes entrar { from { opacity: 0; transform: translateY(18px); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ====================================================
   RESPONSIVO — tablet e celular (painéis empilhados)
   ==================================================== */
@media (max-width: 960px) {
  .page { grid-template-columns: 1fr; }

  /* a borda ondulada passa para baixo do painel */
  .panel { padding-bottom: 96px; }   /* espaço para o halter não cobrir o botão */
  .panel::after {
    top: auto; left: 0; right: 0;
    bottom: calc(var(--wave) * -1);
    width: auto; height: var(--wave);
    background: radial-gradient(circle at 50% 0, var(--c-brand) calc(var(--wave) - 0.5px), transparent var(--wave));
    background-size: calc(var(--wave) * 2) var(--wave);
  }
  .content { padding-top: 40px; }
  .halter--painel { width: 72px; bottom: 10px; }

  .side { padding: calc(var(--wave) + 28px) var(--pad) 0; }
  .photo { padding-top: 28px; }
  .photo__frame { width: min(86%, 440px); }
  .tag { left: 4%; bottom: 8%; }
}

@media (max-width: 600px) {
  .desc { max-width: none; }
  .cta { width: 100%; min-width: 0; min-height: 70px; padding: 20px 24px; }   /* celular: botão mais alto */
  .halter--topo { width: 64px; left: auto; right: 4%; top: auto; bottom: 40%; }
  .tag { font-size: 0.85rem; padding: 10px 20px; }
}
</style>

<!-- ===== Meta Pixel + API de Conversões: evento Lead no botão do grupo ===== -->
<script>
(function () {
  var cards = document.querySelectorAll('[data-grupo]');
  if (!cards.length) return;

  // O pixel é OPCIONAL aqui. Se ele estiver bloqueado, a API de Conversões
  // continua sendo enviada — é justamente o caminho que precisa sobreviver.
  var temPixel = (typeof fbq === 'function');

  // Congelado no carregamento: o _fbc reconstruído tem que ser estável.
  var TS_ENTRADA = Date.now();
  var PARAMS = (function () {
    try { return new URLSearchParams(location.search); } catch (e) { return null; }
  })();

  // decodeURIComponent lança em qualquer cookie com "%" solto.
  function lerCookie(nome) {
    var m = document.cookie.match('(^|;)\\s*' + nome + '\\s*=\\s*([^;]+)');
    if (!m) return undefined;
    try { return decodeURIComponent(m[2]); } catch (e) { return m[2]; }
  }

  function obterFbclid() {
    return (PARAMS && PARAMS.get('fbclid')) || undefined;
  }

  // Se o pixel ainda não gravou o _fbc, reconstrói a partir do fbclid da URL.
  function obterFbc() {
    var cookie = lerCookie('_fbc');
    if (cookie) return cookie;
    var fbclid = obterFbclid();
    return fbclid ? 'fb.1.' + TS_ENTRADA + '.' + fbclid : undefined;
  }

  // Trava por grupo, na sessão: quem volta do WhatsApp e toca de novo
  // no botão não conta como lead novo.
  function jaContou(grupo) {
    try { return sessionStorage.getItem('flow_lead_' + grupo) === '1'; }
    catch (e) { return false; }
  }
  function marcarContado(grupo) {
    try { sessionStorage.setItem('flow_lead_' + grupo, '1'); } catch (e) {}
  }

  function dispararLead(el) {
    var grupo = el.dataset.grupo;
    var nicho = el.dataset.nicho;
    if (!grupo) return;

    var agora = Date.now();
    if (el.__leadTs && agora - el.__leadTs < 2000) return;
    el.__leadTs = agora;

    if (jaContou(grupo)) return;
    marcarContado(grupo);

    // Um único event_id para os dois caminhos: a Meta deduplica e conta uma vez.
    var sufixo = (Math.random().toString(36) + '00000000').slice(2, 10);
    var eventId = 'lead-' + agora + '-' + sufixo;

    var corpo = JSON.stringify({
      event_id: eventId,
      event_time: Math.floor(agora / 1000),
      content_name: grupo,
      content_category: nicho,
      event_source_url: location.href,
      fbp: lerCookie('_fbp'),
      fbc: obterFbc(),
      fbclid: obterFbclid()
    });

    // Caminho 1 — API de Conversões, PRIMEIRO. Quando o sendBeacon existe,
    // ele é o único caminho (pode devolver false e mesmo assim entregar).
    try {
      if (navigator.sendBeacon) {
        try {
          navigator.sendBeacon('/api/lead', new Blob([corpo], { type: 'application/json' }));
        } catch (e) {
          if (window.fetch) {
            fetch('/api/lead', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: corpo,
              keepalive: true
            }).catch(function () {});
          }
        }
      } else if (window.fetch) {
        fetch('/api/lead', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: corpo,
          keepalive: true
        }).catch(function () {});
      }
    } catch (e) {}

    // Caminho 2 — pixel do navegador, isolado para não derrubar o de cima.
    if (temPixel) {
      try {
        fbq('track', 'Lead',
          { content_name: grupo, content_category: nicho },
          { eventID: eventId });
      } catch (e) {}
    }
  }

  cards.forEach(function (el) {
    el.addEventListener('click', function (e) {
      if (e.isTrusted === false) return;
      dispararLead(el);
    });
    el.addEventListener('auxclick', function (e) {
      if (e.isTrusted === false || e.button !== 1) return;
      dispararLead(el);
    });
  });
})();
</script>
